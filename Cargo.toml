[workspace]
members = ["crates/git-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

# Release: smaller, faster binary. No `panic = "abort"` — git-core relies on catch_unwind.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
