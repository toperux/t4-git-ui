version: 2
updates:
  # Workflow actions are pinned to commits; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # These bumps change `.github/workflows/*.yml` and nothing else, so `ci` is the
    # accurate type; `chore` is the catch-all, and every other subject in this repo
    # is `ci:` / `docs:` / `fix:` with no scope. The `deps` scope is kept so bot
    # bumps stay separable from hand-written CI commits. Dependabot supplies the
    # colon, giving `ci(deps): Bump …`.
    commit-message:
      prefix: ci
      include: scope

  # The Rust tree is the whole app; without this it never gets bumped and a
  # security advisory against a transitive crate goes unnoticed. These bumps
  # are not CI changes, so `build` is their type. The `dependencies` label
  # keeps them off the release page (see .github/release.yml), whatever the
  # prefix. One PR for the lot: the bumps share a Cargo.lock, so separate PRs
  # would conflict with each other and each need a rebase to go green.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns:
          - "*"

  # Same for the frontend and its package-lock.json — for patch and minor bumps.
  # A major (TypeScript, Vite, Vitest) can break the build on its own, and in
  # the group it holds every safe bump hostage; majors come one PR each.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
