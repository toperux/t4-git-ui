name: Release

# Tag a commit `v<version>` and push the tag; this builds the packages for all
# three platforms and publishes them. `workflow_dispatch` builds the same
# artifacts and rehearses the publish with a draft release it then deletes,
# for when you want to check the packaging without burning a version number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only by default. Only `publish` gets write access, and it runs no build
# tooling, so nothing that compiles or packages holds a token able to change
# the repository.
permissions:
  contents: read

jobs:
  # Resolved once and shared. The tag and Cargo.toml must agree, or the release
  # is called v0.2.0 and ships an installer named 0.1.0. Cheap to check,
  # confusing to discover later.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          # [workspace.package] in the root Cargo.toml. src-tauri inherits it,
          # and tauri.conf.json carries no version of its own.
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          # package.json's version is what the start screen renders; it must
          # agree with Cargo.toml or the shipped installer's UI lies about its
          # own version.
          pkg=$(node -p "require('./package.json').version")
          if [[ "$pkg" != "$crate" ]]; then
            echo "package.json version $pkg does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          # The builds run `cargo --locked` and `npm ci`, so a lock file left
          # behind by a bump fails every leg after the tag is already public.
          # Catch it here, where the only cost is a red check on a tag nobody
          # has downloaded.
          lock=$(grep -A1 '^name = "t4-git-ui"$' Cargo.lock | grep -m1 '^version = ' | cut -d'"' -f2)
          if [[ "$lock" != "$crate" ]]; then
            echo "Cargo.lock version $lock does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          nlock=$(node -p "require('./package-lock.json').version")
          if [[ "$nlock" != "$crate" ]]; then
            echo "package-lock.json version $nlock does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          # workflow_dispatch has no tag, so there is nothing to compare against,
          # and it is allowed to build whatever version the tree has - packaging
          # can then be checked in the middle of a bump.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Plain x.y.z only: the rpm tooling rejects a `-rc.1` suffix.
            if ! [[ "$crate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version $crate is not a plain x.y.z release" >&2
              exit 1
            fi
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$crate" ]]; then
              echo "tag $tag does not match Cargo.toml version $crate" >&2
              exit 1
            fi
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  # The release build does not run the tests (D7), so the checks run here
  # instead, at this exact commit. They gate `publish`, not `build`: the two
  # run side by side, and a failure means the artifacts exist but nothing is
  # published.
  #
  # Tags only. All this job protects is a real release, and a workflow_dispatch
  # run only ever makes a draft it deletes again, so there the matrix would be
  # three legs guarding nothing. `publish` expects it skipped on a dispatch.
  checks:
    needs: version
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/checks.yml

  build:
    needs: version
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every signing secret lives in the `signing` environment, which only main
    # and `v*` tags may use, so a run from any other branch fails every leg
    # rather than build without its keys. Every leg uses it: the updater key
    # signs all three. The Certum secrets reach only the Windows leg's bundle
    # step, and the macOS certificate only its import step.
    environment: signing
    strategy:
      fail-fast: false
      matrix:
        include:
          # bundle_dir is relative to the repo root: this is a cargo workspace,
          # so the Tauri CLI writes under the root target/, not src-tauri/target/.
          - os: windows-latest
            bundles: nsis
            bundle_dir: target/release/bundle
          - os: macos-latest
            bundles: app,dmg
            # One .dmg for both Apple Silicon and Intel.
            target: universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
          # 22.04 rather than latest: the .deb links against the builder's
          # glibc, so the oldest supported runner reaches the most distros.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            bundle_dir: target/release/bundle

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Linux build dependencies (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools
          # appimage-strip.sh needs squashfs-tools 4.5+. Debian versions carry
          # epoch 1, so the floor is 1:4.5: a bare 4.5 would pass any version.
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' squashfs-tools)" ge 1:4.5 \
            || { echo "squashfs-tools $(dpkg-query -W -f='${Version}' squashfs-tools) is older than the 1:4.5 appimage-strip.sh needs" >&2; exit 1; }

      # Every action is pinned to a commit, not a tag, GitHub's own included:
      # this job ends up holding the signing key, and a tag or branch can be
      # moved to code nobody reviewed. Dependabot bumps the pins.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Add the Apple targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `cargo tauri build` runs `npm run build` first (beforeBuildCommand in
      # tauri.conf.json), so the frontend dependencies have to be in place.
      - name: Install npm dependencies
        run: npm ci

      - name: Install the Tauri CLI
        # Built from crates.io with the CLI's own lockfile, so every crate is
        # checksum-verified. rust-cache keeps ~/.cargo/bin, so this is a no-op
        # only on a warm cache, which a tag run rarely has; ~10 min on a cold one.
        # Pinned exactly: this job holds the signing key. Pinned to match
        # @tauri-apps/cli in package-lock.json (they share versions); bump both
        # together. Without `--locked` the build takes the newest tauri-bundler,
        # which the pinned CLI may not compile against (bundler 2.10.0 broke
        # 2.11.4). checks.yml fails a PR whose package-lock.json and this pin
        # differ; it reads the version from the line below.
        run: cargo install tauri-cli --version 2.11.5 --locked

      # Staging picks the first file matching each glob, and the cache restores
      # target/ from an earlier run. A leftover installer from a previous
      # version would be staged as this version's. Cheaper to start from nothing.
      - name: Clear stale bundle output
        shell: bash
        run: rm -rf "${{ matrix.bundle_dir }}"

      # Windows code signing with the Certum Open Source certificate, whose key
      # lives in SimplySign's cloud. ssign reaches SimplySign over HTTPS, so
      # there is no Certum desktop client to install and no GUI login to
      # script. It is pinned to the commit tested locally, for the same reason
      # the actions are pinned: it handles the TOTP seed, which can sign as the
      # project until it is regenerated. The sign command goes in through
      # --config, not tauri.conf.json, so a local build still works without
      # credentials. Verbose on both: Tauri swallows the sign command's output
      # otherwise, so a failed sign says only "failed to run ssign", and
      # ssign's -v shows which stage failed (login, certificate or signing).
      #
      # ssign signs in place by renaming a signed copy over the original, and
      # on the runner Windows refuses that rename ("Access is denied"). Writing
      # the file in place works: Tauri patches the exe that way a moment
      # earlier. So sign.ps1 has ssign write into a separate folder, then
      # writes the result back in place, as signtool itself does.
      - name: Set up Windows code signing
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/Le-Syl21/ssign \
            --rev 585a88e77443f1cbac7fc63b87155982139208b6 ssign
          # Forward slashes: the path goes inside JSON, where \a is no escape.
          tmp=$(cygpath -m "$RUNNER_TEMP")
          cat > "$tmp/sign.ps1" <<'PS1'
          param([string]$File)
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'signed'
          ssign -v -o $out $File
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $signed = Join-Path $out (Split-Path $File -Leaf)
          [IO.File]::WriteAllBytes($File, [IO.File]::ReadAllBytes($signed))
          PS1
          cat > "$tmp/signing.json" <<JSON
          {"bundle":{"windows":{"signCommand":{"cmd":"pwsh","args":["-NoProfile","-File","$tmp/sign.ps1","%1"]}}}}
          JSON
          echo "SIGNING_ARGS=--verbose --config $tmp/signing.json" >> "$GITHUB_ENV"

      # Compile with no secrets in env: every build.rs and proc-macro runs here.
      # Defence in depth, not a boundary: a malicious build script could still
      # leave something behind for the steps that hold the keys.
      #
      # Run from the repo root: the Tauri CLI finds src-tauri/ on its own.
      # Arguments after `--` go to `cargo build`.
      - name: Build the app
        run: >
          cargo tauri build --no-bundle
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          -- --locked

      # The AppImage bundler downloads its tools from moving URLs (master,
      # `continuous`) and runs them with the updater key in env, but skips any
      # file already in its cache dir. Seed pinned, hashed copies there — and
      # the runtime appimagetool would otherwise fetch from `continuous`, which
      # becomes the head of every AppImage shipped. Names are tauri-bundler
      # 2.9.4's (tauri-cli 2.11.5); "Bundle and sign" fails if a CLI bump makes
      # the bundler itself download a tool. A fetch by appimagetool would not
      # show in that log — the runtime pin is checked by the dry run instead.
      - name: Pin the AppImage tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$dir"
          fetch() {
            curl -fsSL --retry 3 -o "$dir/$1" "$2"
            echo "$3  $dir/$1" | sha256sum -c -
            chmod 770 "$dir/$1"
          }
          rel=https://github.com
          raw=https://raw.githubusercontent.com
          fetch AppRun-x86_64 $rel/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
          fetch linuxdeploy-x86_64.AppImage $rel/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef
          fetch linuxdeploy-plugin-gtk.sh $raw/tauri-apps/linuxdeploy-plugin-gtk/dda522bce37387f1b853d9095713bfaa924c8423/linuxdeploy-plugin-gtk.sh 7804c9eef13e59bf2783aad9882ef9db8f3f3f9e8d631874b1d348d550a3693f
          fetch linuxdeploy-plugin-gstreamer.sh $raw/tauri-apps/linuxdeploy-plugin-gstreamer/2a2e67491c32995a3f279ad0ecbe77abd512b42a/linuxdeploy-plugin-gstreamer.sh c107b49d84edbffc6ab226ed1007e0626a4f7aa2c3a36b7782bef62351d49e94
          fetch linuxdeploy-plugin-appimage.AppImage $rel/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
          fetch runtime-x86_64 $rel/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          echo "LDAI_RUNTIME_FILE=$dir/runtime-x86_64" >> "$GITHUB_ENV"

      # Tauri's own APPLE_CERTIFICATE importer resolves the identity by scanning
      # for Apple's own certificate names ("Developer ID Application: …" and six
      # siblings). A self-signed one matches none of them, so `identity::list`
      # comes back empty and the build dies with ResolveSigningIdentity. The
      # certificate is therefore imported here and Tauri is handed the identity
      # name alone, which sends it down `with_signing_identity` instead. The
      # secrets stay in this macOS-only step: no other leg needs them, and
      # whoever holds them can sign as either T4 app. It runs after the
      # compile, so no build script or proc-macro finds the certificate in an
      # unlocked keychain open to codesign.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -base64 24)
          base64 --decode <<<"$APPLE_CERTIFICATE" > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # Self-signed: nothing vouches for it until it is trusted here.
          security find-certificate -p -c "T4 Apps Self-Signed Code Signing" "$kc" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

      # `cargo tauri bundle` compiles nothing; it packages the build above,
      # signs it, and writes the updater .sig files. Run from the repo root,
      # as the build.
      #
      # The signing key is what turns `createUpdaterArtifacts` into actual `.sig`
      # files. With a `pubkey` in the config and no private key the bundler does
      # not carry on unsigned: it aborts with "A public key has been found, but
      # no private key" — so a missing secret reddens this step, not staging.
      #
      # macOS keys a folder-access grant (Documents / Desktop / Downloads) to the
      # app's code signature, so an unsigned build asks again on every launch —
      # worse here than in most apps, because the recursive watcher, the git2
      # reads and every spawned `git` are charged to the parent. Shared with
      # the sibling app; the app identifier keeps the two distinct. Self-signed
      # and *not* notarized, so Gatekeeper still stops the first launch.
      # APPLE_CERTIFICATE must NOT be set here: it would send Tauri back down the
      # importer that cannot resolve this certificate.
      - name: Bundle and sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: T4 Apps Self-Signed Code Signing
          # Read by ssign when Tauri runs the Windows sign command. Windows
          # only: the other legs share the environment but have no use for the
          # TOTP seed. The first sign logs in and caches the session on disk,
          # so the app, the uninstaller and the installer need only one
          # one-time code.
          CERTUM_EMAIL: ${{ runner.os == 'Windows' && secrets.CERTUM_EMAIL || '' }}
          CERTUM_OTP: ${{ runner.os == 'Windows' && secrets.CERTUM_OTP || '' }}
        run: |
          cargo tauri bundle --bundles ${{ matrix.bundles }} \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            ${{ env.SIGNING_ARGS }} 2>&1 | tee "$RUNNER_TEMP/bundle.log"
          # Every AppImage tool is pinned in "Pin the AppImage tools".
          if [ "$RUNNER_OS" = Linux ] && grep -q Downloading "$RUNNER_TEMP/bundle.log"; then
            echo "bundler downloaded a tool the pins do not cover" >&2; exit 1
          fi

      # The thumbprint, not just a valid signature, so a build signed with
      # anything else fails here, as in the macOS check below. The installer
      # is checked, since it is what people download and what the updater
      # fetches, and so is every exe inside it, the app included. The app in
      # target/release proves nothing: Tauri signs a patched copy for the
      # installer and restores the unsigned build output afterwards. 7-Zip
      # unpacks NSIS installers. The certificate expires 2027-09-22, and
      # renewing it means updating this.
      - name: Check the Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thumb = 'F06C1EC1FAC43DFEC92FBE47B0FC959D1CE38151'
          $installer = @(Get-ChildItem '${{ matrix.bundle_dir }}/nsis/*-setup.exe')
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          7z x $installer[0].FullName "-o$unpacked" -y | Out-Null
          if ($LASTEXITCODE) { throw '7-Zip could not unpack the installer' }
          $files = @($installer[0].FullName) +
            @(Get-ChildItem $unpacked -Recurse -Filter *.exe).FullName
          if ($files.Count -lt 2) { throw 'no exe inside the installer' }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            # Printed before checking, so a failure shows what it was signed with.
            "== $f"
            "$($sig.Status) | $($sig.SignerCertificate.Subject) | $($sig.SignerCertificate.Thumbprint) | timestamped: $($null -ne $sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid' -or
                $sig.SignerCertificate.Thumbprint -ne $thumb -or
                $null -eq $sig.TimeStamperCertificate) {
              throw "not signed with the Certum certificate: $f"
            }
          }

      # linuxdeploy bundles this runner's libwayland-client (1.20), and a newer
      # host's Mesa EGL uses symbols 1.20 lacks: EGL_BAD_PARAMETER and a blank
      # window. Neither the bundler nor linuxdeploy's environment has a hook to
      # exclude a library, so the image is repacked without it; the script's
      # header has the detail. Drop this and the re-sign step once Tauri's
      # linuxdeploy picks up the upstream excludelist (pkg2appimage#559); keep
      # the `verify` job's AppImage check, which costs nothing. Moving the
      # runner would not do it: 24.04 still ships 1.22.
      #
      # `-maxdepth 1`: the bundler leaves `T4 Git UI.AppDir` beside the image.
      - name: Remove libwayland-client from the AppImage
        id: appimage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t found < <(find '${{ matrix.bundle_dir }}/appimage' -maxdepth 1 -name '*.AppImage')
          if [ "${#found[@]}" -ne 1 ]; then
            echo "expected one .AppImage, found ${#found[@]}: ${found[*]}" >&2
            exit 1
          fi
          .github/scripts/appimage-strip.sh "${found[0]}"
          echo "file=${found[0]}" >> "$GITHUB_OUTPUT"

      # The repack changed the file the bundler signed, so it is signed again.
      # The key is in this step alone. `signer sign` overwrites `<file>.sig`.
      # `--app-version`: from 2.11.5, `tauri bundle` binds the version into every
      # other updater signature, and the updater rejects a bound version that
      # differs from latest.json's. The re-signed AppImage carries it too.
      - name: Re-sign the AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FILE: ${{ steps.appimage.outputs.file }}
          VER: ${{ needs.version.outputs.version }}
        run: cargo tauri signer sign --app-version "$VER" "$FILE"

      # A missing or rejected certificate has to redden the run rather than ship
      # an unsigned .app quietly: the whole point is a signature that stays the
      # same across versions, so a release that silently lost it would reset
      # every Mac user's folder grants without anyone noticing.
      #
      # All three macOS artifacts are checked, not just the .app sitting in the
      # bundle directory: the .dmg is what people download, and the .app.tar.gz is
      # what an installed copy downloads when it updates itself. Both are repacked
      # copies, so checking only the .app would rest on the assumption that the
      # bundler packs them after signing — and that assumption failing is exactly
      # the silent identity regression this step exists to catch. At tauri-cli
      # 2.11.5 the bundler does sign first: both repacked copies were confirmed to
      # carry the certificate. So this guards against a version bump reordering
      # that, rather than doubting the current order.
      #
      # Matched on the certificate's SHA-1 in the designated requirement, not on
      # its name: macOS keys the grant to the certificate itself, so a regenerated
      # certificate with the same Common Name is a different identity and must not
      # pass. Rotating the certificate means updating this hash.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle='${{ matrix.bundle_dir }}'
          fp='H"53effb03083bba9accd9b16f4e5db6c6ae5acc39"'
          mnt=""
          trap '[ -n "$mnt" ] && hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT

          # Captured rather than piped straight into grep: on a mismatch the log
          # has to show what it was actually signed with, or the operator cannot
          # tell a missing secret from the wrong certificate. Called plainly, never
          # as `check ... || ...`, so errexit stays live inside it — under `||` a
          # failed codesign would be swallowed and only the grep would decide.
          check() {
            echo "== $1"
            codesign --verify --deep --strict --verbose=2 "$2"
            req=$(codesign -d -r- "$2" 2>&1)
            echo "$req"
            grep -qiF "$fp" <<<"$req"
          }

          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit || true)
          [ -n "$app" ] || { echo "no .app under $bundle/macos" >&2; exit 1; }
          check "bundle: $app" "$app"

          tgz=$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit || true)
          [ -n "$tgz" ] || { echo "no .app.tar.gz under $bundle/macos" >&2; exit 1; }
          tmp=$(mktemp -d)
          tar -xzf "$tgz" -C "$tmp"
          tapp=$(find "$tmp" -maxdepth 1 -name '*.app' -print -quit || true)
          [ -n "$tapp" ] || { echo "no .app inside $tgz" >&2; exit 1; }
          check "updater tarball: $tgz" "$tapp"

          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit || true)
          [ -n "$dmg" ] || { echo "no .dmg under $bundle/dmg" >&2; exit 1; }
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          dapp=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit || true)
          [ -n "$dapp" ] || { echo "no .app inside $dmg" >&2; exit 1; }
          check "dmg: $dmg" "$dapp"

      # Tauri names bundles with the product name, and GitHub rewrites spaces
      # in asset names anyway. Pick the final names here instead of letting the
      # upload mangle them.
      - name: Stage the artifacts
        shell: bash
        run: |
          set -euo pipefail
          ver='${{ needs.version.outputs.version }}'
          # Not `dist/`: that is the Vite output the bundle was built from.
          out="$GITHUB_WORKSPACE/packages"
          mkdir -p "$out"
          cd "${{ matrix.bundle_dir }}"

          stage() {
            local src
            src=$(find . -path "./$1" -print -quit)
            if [ -z "$src" ]; then
              echo "no bundle matched $1" >&2
              exit 1
            fi
            cp "$src" "$out/$2"
          }

          # The .sig files are what latest.json is built from, and what an
          # installed copy verifies its download against. The updater fetches the
          # same file a human downloads — except on macOS, where it updates from
          # a tarball of the .app rather than from the .dmg. A .deb or .rpm gets
          # no signature: those belong to the package manager and the app sends
          # people to the releases page instead.
          case '${{ runner.os }}' in
            Windows)
              stage 'nsis/*-setup.exe'         "T4-Git-UI_${ver}_x64-setup.exe"
              stage 'nsis/*-setup.exe.sig'     "T4-Git-UI_${ver}_x64-setup.exe.sig"
              ;;
            macOS)
              stage 'dmg/*.dmg'                "T4-Git-UI_${ver}_universal.dmg"
              stage 'macos/*.app.tar.gz'       "T4-Git-UI_${ver}_universal.app.tar.gz"
              stage 'macos/*.app.tar.gz.sig'   "T4-Git-UI_${ver}_universal.app.tar.gz.sig"
              ;;
            Linux)
              stage 'deb/*.deb'                "T4-Git-UI_${ver}_amd64.deb"
              stage 'rpm/*.rpm'                "T4-Git-UI_${ver}_x86_64.rpm"
              stage 'appimage/*.AppImage'      "T4-Git-UI_${ver}_x86_64.AppImage"
              stage 'appimage/*.AppImage.sig'  "T4-Git-UI_${ver}_x86_64.AppImage.sig"
              ;;
          esac

          cd "$out"
          for f in *; do
            # A signature is not a download anyone verifies by hand, so it gets
            # no sidecar of its own.
            case "$f" in *.sha256 | *.sig) continue ;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              hash=$(sha256sum "$f" | cut -d' ' -f1)
            else
              hash=$(shasum -a 256 "$f" | cut -d' ' -f1)
            fi
            printf '%s  %s' "$hash" "$f" > "$f.sha256"
            echo "$f  $hash"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ runner.os }}
          path: packages/*

  # Every updater .sig, checked against the file it signs, the pubkey the app
  # ships with, and the version being released. A bad one would fail every
  # installed copy's update, and nobody would hear of it until they tried: a
  # .sig left over from before the AppImage repack, say, or one without the
  # `version:` that requireSignedVersion makes the updater insist on. Its own
  # job, after all three legs, so one Python setup covers them, it holds no
  # secrets, and it checks the exact files `publish` ships.
  verify:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Install python3-cryptography
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
          python3 -c 'import cryptography'

      - name: Check the updater signatures
        shell: bash
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for suffix in x64-setup.exe universal.app.tar.gz x86_64.AppImage; do
            f="dist/T4-Git-UI_${VER}_${suffix}"
            python3 .github/scripts/verify-updater-sig.py "$f" "$f.sig" src-tauri/tauri.conf.json "$VER"
          done

  # On a tag this is the release. On a workflow_dispatch it is a rehearsal:
  # Dependabot's pull requests run only checks.yml, so a bumped
  # download-artifact or action-gh-release would otherwise first run on a real
  # tag, with nothing left to do but re-run it. The rehearsal makes the same
  # write against a draft and deletes it again.
  #
  # `checks` runs on tags only, and a skipped need skips this job too unless
  # the `if` says otherwise. `!cancelled()` lifts that default, so every need
  # is checked by hand: a tag needs `checks` passed; a dispatch needs it
  # skipped, which is what it always is on a branch. A dispatch on a tag ref
  # runs `checks` and takes the first branch, and is still only a draft: the
  # release step keys the draft on the event, not the ref.
  publish:
    needs: [version, checks, build, verify]
    if: >-
      ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.build.result == 'success'
      && needs.verify.result == 'success'
      && ((startsWith(github.ref, 'refs/tags/') && needs.checks.result == 'success')
      || (github.event_name == 'workflow_dispatch' && needs.checks.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # The only job that writes anything: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The updater's manifest, and the file the endpoint in tauri.conf.json
      # points at. Written here rather than during the build because this is the
      # only job that holds all three platforms' signatures at once.
      #
      # It cannot carry the release notes: this runs before the release exists,
      # so it links to the tag and the app opens that.
      - name: Write the update manifest
        working-directory: dist
        env:
          VER: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ASCII only below: python3 reads this from stdin and decodes it with
          # the runner's locale, so a stray em dash is a syntax error on any box
          # that is not UTF-8.
          python3 - <<'PY' > latest.json
          import json, os, pathlib

          ver, repo = os.environ["VER"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/v{ver}"

          def entry(suffix):
              asset = f"T4-Git-UI_{ver}_{suffix}"
              sig = pathlib.Path(asset + ".sig")
              if not sig.is_file():
                  raise SystemExit(f"missing signature: {sig}")
              return {"signature": sig.read_text().strip(), "url": f"{base}/{asset}"}

          # One universal build serves both Macs, so both keys name the same file.
          mac = entry("universal.app.tar.gz")

          print(json.dumps({
              "version": ver,
              "notes": f"T4 Git UI {ver}. Release notes: https://github.com/{repo}/releases/tag/v{ver}",
              "platforms": {
                  "windows-x86_64": entry("x64-setup.exe"),
                  "darwin-x86_64": mac,
                  "darwin-aarch64": mac,
                  "linux-x86_64": entry("x86_64.AppImage"),
              },
          }, indent=2))
          PY
          cat latest.json

      # `name` is set here because the default is the bare tag, and every
      # release before this one is titled `T4 Git UI v<x.y.z>` — one unnamed
      # release and the list stops reading as one product.
      #
      # On a tag the action names the release after it and publishes. On a
      # dispatch it makes a draft under a throwaway tag name; a draft only
      # records the tag as pending, and GitHub creates it on publishing, which
      # the action skips when `draft` is true.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('dry-run-{0}', github.run_id) || '' }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Dry run — T4 Git UI v{0}', needs.version.outputs.version) || format('T4 Git UI v{0}', needs.version.outputs.version) }}
          generate_release_notes: true
          body: |
            ### Windows

            `T4-Git-UI_${{ needs.version.outputs.version }}_x64-setup.exe` —
            per-user install, no admin prompt, into `%LOCALAPPDATA%\T4 Git UI`.

            Signed with a Certum Open Source certificate, publisher "Open Source
            Developer Christopher Montevirgen". SmartScreen can still show
            "Windows protected your PC" while the certificate builds a download
            reputation: **More info** → **Run anyway**. v0.10.14 and earlier are
            unsigned.

            ### macOS

            `T4-Git-UI_${{ needs.version.outputs.version }}_universal.dmg` —
            Apple Silicon and Intel in one image. Drag to Applications, then:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/T4 Git UI.app"
            ```

            Signed with a self-signed certificate but not notarized, so without that
            Gatekeeper still refuses it. If you would rather not run the command:
            **System Settings → Privacy & Security → Open Anyway** (on macOS 14 and
            earlier, right-click → **Open** does the same). Signing is what gives the
            app a stable identity, which is what macOS keys Documents / Desktop /
            Downloads access to.

            The `.app.tar.gz` beside it is what an installed copy downloads when it
            updates itself; there is no reason to fetch it by hand.

            ### Linux

            `.deb`, `.rpm`, and `.AppImage`.

            ```sh
            sudo apt install ./T4-Git-UI_${{ needs.version.outputs.version }}_amd64.deb
            ```

            An AppImage from 0.10.12 or earlier opens a blank window on distributions
            with a recent Mesa, so it cannot update itself: download this one by hand.
            If this one is blank too, see the
            [README's note](https://github.com/${{ github.repository }}#install) on
            `WEBKIT_DISABLE_DMABUF_RENDERER`.

            An AppImage from 0.10.13 or earlier doesn't reopen after updating on some
            distributions; start it again yourself. <!-- drop with the 0.10.12 line -->

            ### Verifying a download

            Every package ships a `.sha256` sidecar (the `.sig` files and
            `latest.json` do not). Check one with `sha256sum -c`
            on Linux, `shasum -a 256 -c` on macOS, or on Windows:

            ```powershell
            Get-FileHash '.\<file>' -Algorithm SHA256
            ```

      # The rehearsal's own check, then its cleanup. It runs whatever failed
      # above, so a draft left half-uploaded is still removed; if the draft was
      # never made there is nothing to do, and the step that failed is the
      # failure the run reports. Not `--cleanup-tag`: the draft never created
      # its tag, and gh fails deleting a ref that does not exist. A tag found
      # anyway is removed and fails the run, since a dispatch promised none.
      - name: Check and delete the dry-run draft
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: dry-run-${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>"$RUNNER_TEMP/view.err"); then
            if grep -q 'release not found' "$RUNNER_TEMP/view.err"; then
              echo "no $TAG draft to check or delete"
              exit 0
            fi
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          ok=true
          # Sorted name lists, so a missing, extra or renamed asset all show.
          if ! diff <(ls dist | sort) <(sort <<<"$names"); then
            echo "the draft's assets do not match dist/ (< dist, > draft)" >&2
            ok=false
          fi
          gh release delete "$TAG" --yes
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" --silent
            echo "the draft created tag $TAG; deleted it" >&2
            ok=false
          fi
          $ok
