[package]
name = "t4-git-ui"
version.workspace = true
edition.workspace = true
description = "GitExtensions-style git GUI"
# `commands::update` builds the releases-page link from this.
repository = "https://github.com/toperux/t4-git-ui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "t4_git_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
git-core = { path = "../crates/git-core" }
serde.workspace = true
# `generate_context!` parses the `plugins` config through it, so it has to be a
# normal dependency, not just a dev one.
serde_json = "1"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3.27.0"
tokio-util = "0.7.19"

# Which window a dragged tab is over is a z-order question only the compositor
# can answer, and Tauri exposes no z-order: `window_at` calls WindowFromPoint.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
